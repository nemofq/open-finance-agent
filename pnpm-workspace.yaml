allowBuilds:
  # Deno's own postinstall only re-downloads the binary the platform package already ships.
  deno: false
  '@google/genai': false
  esbuild: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
# rehype-katex 7 pins katex ^0.16, whose markup the 0.18 stylesheet no longer styles; keep one copy.
overrides:
  katex: ^0.18.2
