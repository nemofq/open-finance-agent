allowBuilds:
  # Deno's own postinstall only re-downloads the binary the platform package already ships.
  deno: false
  '@google/genai': false
  esbuild: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
# pi 1.1.0 was taken on its release day, inside pnpm's minimum release age; remove these once it passes.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.1.0'
  - '@earendil-works/pi-ai@1.1.0'
  - '@earendil-works/pi-telemetry@1.1.0'
